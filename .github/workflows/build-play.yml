name: Собрать приложение для Google Play

on:
  push:
    branches: [main, master]
    paths: ["play-app/app/**", "play-app/*.gradle", ".github/workflows/build-play.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Сборка AAB (для Google Play) и APK (для проверки)
        working-directory: play-app
        run: gradle bundleRelease assembleRelease --no-daemon

      - name: Собрать файлы
        run: |
          cp play-app/app/build/outputs/bundle/release/app-release.aab Ferma-uchet.aab
          cp play-app/app/build/outputs/apk/release/app-release.apk Ferma-uchet.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: play-1.0.${{ github.run_number }}
          name: Ферма — учёт коров (Google Play) 1.0.${{ github.run_number }}
          body: |
            Ferma-uchet.aab — загружать в Google Play Console.
            Ferma-uchet.apk — установить на телефон для проверки.
          files: |
            Ferma-uchet.aab
            Ferma-uchet.apk
          make_latest: false

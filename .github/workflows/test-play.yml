name: Проверка приложения на эмуляторах Android

on:
  push:
    branches: [main, master]
    paths: ["play-app/**", ".github/workflows/test-play.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Сборка тестовой версии
        working-directory: play-app
        run: gradle assembleDebug --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Playwright (управление приложением)
        working-directory: play-app/tests
        run: npm init -y >/dev/null && npm i playwright@1.49.1 --no-audit --no-fund

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Запуск на эмуляторе Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r play-app/app/build/outputs/apk/debug/app-debug.apk
            node play-app/tests/android-test.mjs api${{ matrix.api }} || echo "FAIL" > play-app/tests/out/FAILED

      - name: Опубликовать отчёт и скриншоты
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}-api${{ matrix.api }}
          name: Проверка ${{ github.run_number }} · Android API ${{ matrix.api }}
          prerelease: true
          make_latest: false
          files: play-app/tests/out/*

      - name: Итог
        run: test ! -f play-app/tests/out/FAILED

name: Проверка ввода с клавиатуры

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tests/typing.mjs", ".github/workflows/keyboard-test.yml", "android/app/src/**", "play-app/app/src/**"]

permissions:
  contents: write

jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Сборка Ferma.apk
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Сборка Ferma-uchet.apk
        working-directory: play-app
        run: gradle assembleDebug --no-daemon
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Playwright
        run: cd tests && npm init -y >/dev/null && npm i playwright@1.49.1 --no-audit --no-fund
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r play-app/app/build/outputs/apk/debug/app-debug.apk
            node tests/typing.mjs tj.ferma.app ferma || true
            node tests/typing.mjs tj.ferma.uchet uchet || true
      - name: Отчёт
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-${{ github.run_number }}
          name: Проверка клавиатуры ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: tests/out/*

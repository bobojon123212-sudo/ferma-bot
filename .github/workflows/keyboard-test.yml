name: Проверка ввода с клавиатуры

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tests/keyboard.sh", ".github/workflows/keyboard-test.yml", "android/app/src/**", "play-app/app/src/**"]

permissions:
  contents: write

jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Сборка Ferma.apk
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Сборка Ferma-uchet.apk
        working-directory: play-app
        run: gradle assembleRelease --no-daemon
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./tests/keyboard.sh android/app/build/outputs/apk/release/app-release.apk tj.ferma.app ferma 70
            ./tests/keyboard.sh play-app/app/build/outputs/apk/release/app-release.apk tj.ferma.uchet uchet 12
      - name: Отчёт
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-${{ github.run_number }}
          name: Проверка клавиатуры ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: tests/out/*

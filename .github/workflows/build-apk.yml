name: Собрать APK

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Сборка
        working-directory: android
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: gradle assembleRelease --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/release/app-release.apk Ferma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ferma-APK
          path: Ferma.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ферма ${{ github.run_number }}
          body: "Скачать: Ferma.apk ниже. Постоянная ссылка на последнюю версию — https://github.com/${{ github.repository }}/releases/latest/download/Ferma.apk"
          files: Ferma.apk
          make_latest: true

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#f4f1ea;color:#1f2a22;font:15px/1.45 -apple-system,Roboto,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;box-sizing:border-box}
  .logo{width:84px;height:84px;border-radius:24px;background:#2f5d3a;display:grid;place-items:center;font-size:46px;margin:0 auto 14px}
  h1{text-align:center;margin:0 0 4px;font-size:24px}
  p{color:#6b7468;text-align:center;margin:0 0 24px}
  label{display:block;font-size:13px;color:#6b7468;font-weight:600;margin-bottom:6px}
  input{width:100%;box-sizing:border-box;border:1.5px solid #e4dfd3;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:#fff}
  input:focus{border-color:#3f7a4d}
  button{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#2f5d3a;color:#fff;margin-top:14px}
  .hint{font-size:12.5px;text-align:left;margin:8px 0 0}
</style>
</head>
<body>
  <div class="logo">🐄</div>
  <h1>Подключение</h1>
  <p>Введите адрес сервера бота на Render</p>
  <label for="u">Адрес сервера</label>
  <input id="u" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="ferma-bot.onrender.com">
  <p class="hint">Это адрес из панели Render (Dashboard → ваш сервис, ссылка вида <b>что-то.onrender.com</b>).</p>
  <button id="go">Подключиться</button>
<script>
  var inp = document.getElementById("u");
  try { inp.value = (window.Android && Android.getServer()) || ""; } catch (e) {}
  document.getElementById("go").onclick = function () {
    var v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    Android.setServer(v);
  };
  inp.onkeydown = function (e) { if (e.key === "Enter") document.getElementById("go").click(); };
</script>
</body>
</html>
